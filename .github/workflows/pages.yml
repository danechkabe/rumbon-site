name: Sync Notion and publish Rumbon
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: rumbon-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_SYNC_ENABLED: ${{ vars.NOTION_SYNC_ENABLED }}
      NOTION_ROOMS_DATA_SOURCE_ID: ${{ vars.NOTION_ROOMS_DATA_SOURCE_ID }}
      NOTION_APARTMENTS_DATA_SOURCE_ID: ${{ vars.NOTION_APARTMENTS_DATA_SOURCE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify site logic
        run: python -m unittest discover -s tests -v
      - name: Sync published Notion content
        run: python scripts/sync_notion.py
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build localized pages
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ -n "$NOTION_TOKEN" ]; then
            DATA_FILE=data/notion.json python scripts/build.py
          else
            python scripts/build.py
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
